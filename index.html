  X: '✕', Check: '✓', ChevronLeft: '‹', ChevronRight: '›', Users: '👥', Clock: '🕐',

};

function Icon({ name, size = 24, className = '', strokeWidth = 2.5 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.innerHTML = '';
    let done = false;
    try {
      if (window.lucide && window.lucide[name] && window.lucide.createElement) {
        const svg = window.lucide.createElement(window.lucide[name], {
          width: size,
          height: size,
          stroke: 'currentColor',
          'stroke-width': strokeWidth,
          fill: 'none',
        });
        if (svg) {
          svg.style.display = 'block';
          el.appendChild(svg);
          done = true;
        }
      }
    } catch (e) { done = false; }
    if (!done) {
      el.textContent = ICON_FALLBACK[name] || '';
      el.style.fontSize = Math.round(size * 0.8) + 'px';
      el.style.lineHeight = 1;
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }} />;
}

/* ============================== HELPERS ============================== */

function useLocalStorage(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
  }, [key, state]);
  return [state, setState];
}

function pad2(n) { return String(Math.floor(Math.abs(n))).padStart(2, '0'); }

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${pad2(m)}:${pad2(sec)}`;
  return `${pad2(m)}:${pad2(sec)}`;
}

function nextOccurrence(hh, mm) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  if (d.getTime() <= now.getTime()) d.setDate(d.getDate() + 1);
  return d.getTime();
}

function resolveClosestHour24(hour12, minute) {
  const h = ((hour12 % 12) + 12) % 12;
  const amTs = nextOccurrence(h, minute);
  const pmTs = nextOccurrence(h + 12, minute);
  return amTs <= pmTs ? h : h + 12;
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ============================== CAMP TEAM ROSTER ============================== */

const CAMP_TEAMS = [
  { city: 'Klimavitch', counselor: 'Edelkopf', color: 'black' },
  { city: 'Nevel', counselor: 'Wonder', color: 'red' },
  { city: 'Kremenchuk', counselor: 'Fischer', color: 'blue' },
  { city: 'Dnipropetrovsk', counselor: 'Margo', color: 'darkgreen' },
  { city: 'Yekatrinaslav', counselor: 'Wineburg', color: 'yellow' },
  { city: 'Rostov', counselor: 'Naparstak', color: 'brown' },
  { city: 'Otvotsk', counselor: 'Raskin', color: 'orange' },
  { city: 'Nezhin', counselor: 'Sason', color: 'purple' },
  { city: 'Nikolayev', counselor: 'Baumgarten', color: 'grey' },
  { city: 'Poltava', counselor: 'Drizin', color: 'navy' },
].map((t) => ({ ...t, label: `${t.city} - ${t.counselor}` }));

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = [];
  for (let i = 0; i <= m; i++) dp.push([i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function fuzzyDistance(query, text) {
  query = query.toLowerCase();
  text = text.toLowerCase();
  if (!query) return 0;
  if (text.includes(query)) return 0;
  const qLen = query.length;
  let best = Infinity;
  for (let i = 0; i < text.length; i++) {
    for (let len = Math.max(1, qLen - 2); len <= qLen + 2; len++) {
      if (i + len > text.length) continue;
      const d = levenshtein(query, text.slice(i, i + len));
      if (d < best) best = d;
    }
  }
  return best;
}

function searchCampTeams(query) {
  const q = query.trim();
  if (!q) return CAMP_TEAMS;
  const threshold = Math.max(2, Math.ceil(q.length * 0.5));
  return CAMP_TEAMS
    .map((t) => ({ team: t, score: Math.min(fuzzyDistance(q, t.city), fuzzyDistance(q, t.counselor), fuzzyDistance(q, t.label)) }))
    .filter((s) => s.score <= threshold)
    .sort((a, b) => a.score - b.score)
    .map((s) => s.team);
}

function TeamPicker({ label, teamName, teamColor, onSelect, onCustomName, onCustomColor }) {
  const [query, setQuery] = useState(teamName || '');
  const [open, setOpen] = useState(false);
  const [colorOpen, setColorOpen] = useState(false);

  useEffect(() => { setQuery(teamName || ''); }, [teamName]);

  const results = open ? searchCampTeams(query) : [];

  const commit = () => {
    const trimmed = query.trim();
    if (!trimmed) return;
    const exact = CAMP_TEAMS.find((t) => t.label.toLowerCase() === trimmed.toLowerCase());
    if (exact) {
      onSelect(exact);
      setQuery(exact.label);
    } else {
      onCustomName(trimmed);
    }
    setOpen(false);
  };

  return (
    <Field label={label}>
      <TextInput
        value={query}
        onFocus={() => setOpen(true)}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); e.target.blur(); } }}
        onBlur={commit}
        maxLength={20}
        placeholder="Team name..."
      />
      {open && results.length > 0 && (
        <div className="mt-2 rounded-xl bg-white/5 border border-white/10 overflow-hidden max-h-64 overflow-y-auto">

              onMouseDown={(e) => e.preventDefault()}
              onClick={() => { onSelect(t); setQuery(t.label); setOpen(false); }}

            >
              <span className={`w-5 h-5 rounded-full shrink-0 ${teamColorClasses(t.color).bg} border border-white/20`} />
              <span className="font-semibold">{t.label}</span>
            </button>

        </div>

        {colorOpen && (
          <div className="mt-3">
            <ColorPicker value={teamColor} onChange={onCustomColor} />
          </div>
        )}
      </div>
    </Field>

/* ============================== GLOBAL TIMER ============================== */

const TIMER_KEY = 'refcourt_timer_v1';

function defaultTimer() {
  return {
    configured: false,
    mode: 'auto',
    endLabel: '',
    halfMs: 0,
    currentHalf: 1,
    periodEndTs: 0,
    isRunning: false,
    pausedRemainingMs: 0,
    finished: false,
    halftimeMins: 5,
    bufferMins: 2,
  };
}

function useGlobalTimer() {
  const [timer, setTimer] = useLocalStorage(TIMER_KEY, defaultTimer());
  const [, setTick] = useState(0);

  useEffect(() => {
    const id = setInterval(() => setTick((n) => n + 1), 250);
    return () => clearInterval(id);
  }, []);

  let remainingMs = 0;
  if (timer.configured && !timer.finished) {
    remainingMs = timer.isRunning ? Math.max(0, timer.periodEndTs - Date.now()) : timer.pausedRemainingMs;
  }

  useEffect(() => {
    if (!timer.configured || !timer.isRunning || timer.finished) return;
    if (remainingMs <= 0) {
      if (timer.currentHalf === 1) {
        vibrate([180, 100, 180]);
        setTimer((t) => ({
          ...t,
          currentHalf: 2,
          periodEndTs: Date.now() + t.halfMs,
          pausedRemainingMs: t.halfMs,
        }));
      } else {
        vibrate([250, 120, 250, 120, 250]);
        setTimer((t) => ({ ...t, finished: true, isRunning: false, pausedRemainingMs: 0 }));
      }
    }
  }, [remainingMs, timer.configured, timer.isRunning, timer.finished, timer.currentHalf, setTimer]);

  const warnBucketRef = useRef(null);
  useEffect(() => {
    if (!timer.configured || !timer.isRunning || timer.finished) {
      warnBucketRef.current = null;
      return;
    }
    const secs = Math.ceil(remainingMs / 1000);
    if (secs > 0 && secs <= 30 && secs % 5 === 0) {
      if (warnBucketRef.current !== secs) {
        warnBucketRef.current = secs;
        vibrate([90, 50, 90]);
      }
    } else if (secs > 30) {
      warnBucketRef.current = null;
    }
  }, [remainingMs, timer.configured, timer.isRunning, timer.finished]);

  const setupAuto = useCallback((hh, mm, halftimeMins, bufferMins) => {
    const endTs = nextOccurrence(hh, mm);
    const now = Date.now();
    const totalMs = Math.max(60000, endTs - now);
    const ht = Math.max(0, halftimeMins || 0);
    const buf = Math.max(0, bufferMins || 0);
    const deductionMs = (ht + buf) * 60000;
    const playableMs = Math.max(60000, totalMs - deductionMs);
    const half = playableMs / 2;
    const label = 'Ends ' + new Date(endTs).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    setTimer({
      configured: true,
      mode: 'auto',
      endLabel: label,
      halfMs: half,
      currentHalf: 1,
      periodEndTs: now + half,
      isRunning: true,
      pausedRemainingMs: half,
      finished: false,
      halftimeMins: ht,
      bufferMins: buf,
    });
  }, [setTimer]);

  const setupManual = useCallback((minutes) => {
    const now = Date.now();
    const half = Math.max(10000, minutes * 60000);
    setTimer({
      configured: true,
      mode: 'manual',
      endLabel: `Manual · ${minutes} min halves`,
      halfMs: half,
      currentHalf: 1,
      periodEndTs: now + half,
      isRunning: true,
      pausedRemainingMs: half,
      finished: false,
    });
  }, [setTimer]);

  const toggle = useCallback(() => {
    setTimer((t) => {
      if (!t.configured || t.finished) return t;
      if (t.isRunning) {
        return { ...t, isRunning: false, pausedRemainingMs: Math.max(0, t.periodEndTs - Date.now()) };
      }
      return { ...t, isRunning: true, periodEndTs: Date.now() + t.pausedRemainingMs };
    });
  }, [setTimer]);

  const reset = useCallback(() => setTimer(defaultTimer()), [setTimer]);

  return { timer, remainingMs, setupAuto, setupManual, toggle, reset };
}

function TimerSetupSheet({ open, onClose, onSetupAuto, onSetupManual, initialMode, initialHalftimeMins, initialBufferMins, isConfigured, onReset }) {
  const [mode, setMode] = useState(initialMode || 'auto');
  const [hour, setHour] = useState('');
  const [minute, setMinute] = useState('');
  const [minutes, setMinutes] = useState('15');
  const [halftimeMins, setHalftimeMins] = useState(String(initialHalftimeMins ?? 5));
  const [bufferMins, setBufferMins] = useState(String(initialBufferMins ?? 2));

  useEffect(() => {
    if (open) {
      setMode(initialMode || 'auto');
      setHalftimeMins(String(initialHalftimeMins ?? 5));
      setBufferMins(String(initialBufferMins ?? 2));
    }
  }, [open, initialMode, initialHalftimeMins, initialBufferMins]);

  const start = () => {
    if (mode === 'auto') {
      const h12 = parseInt(hour, 10);
      const m = parseInt(minute, 10);
      if (!h12 || h12 < 1 || h12 > 12 || isNaN(m) || m < 0 || m > 59) return;
      const hh = resolveClosestHour24(h12, m);
      const ht = Math.max(0, parseInt(halftimeMins, 10) || 0);
      const buf = Math.max(0, parseInt(bufferMins, 10) || 0);
      onSetupAuto(hh, m, ht, buf);
    } else {
      const m = parseInt(minutes, 10);
      if (!m || m <= 0) return;
      onSetupManual(m);
    }
    onClose();
  };

  const deleteTimer = () => {
    onReset();
    onClose();
  };

  return (
    <Sheet open={open} onClose={onClose} title="Game Clock">
      <Field label="Timer Mode">
        <Segmented
          options={[
            { value: 'auto', label: 'Auto-Split' },
            { value: 'manual', label: 'Manual Countdown' },
          ]}
          value={mode}
          onChange={setMode}
        />
      </Field>

      {mode === 'auto' ? (
        <>
          <p className="text-white/50 text-sm mb-5 leading-relaxed">
            Enter the exact time this activity must end. We'll split the remaining time evenly into two halves and start the countdown.
          </p>
          <Field label="Activity ends at">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <div className="text-[10px] font-bold text-white/30 tracking-widest mb-1 text-center">HOUR</div>
                <input
                  type="number"
                  inputMode="numeric"
                  min="1"
                  max="12"
                  value={hour}
                  onChange={(e) => setHour(e.target.value)}
                  placeholder="7"
                  className="w-full rounded-xl bg-white/10 border border-white/10 px-4 py-4 text-3xl font-extrabold text-white text-center outline-none focus:border-emerald-400/60 tabular"
                />
              </div>
              <div>
                <div className="text-[10px] font-bold text-white/30 tracking-widest mb-1 text-center">MINUTE</div>
                <input
                  type="number"
                  inputMode="numeric"
                  min="0"
                  max="59"
                  value={minute}
                  onChange={(e) => setMinute(e.target.value)}
                  placeholder="00"
                  className="w-full rounded-xl bg-white/10 border border-white/10 px-4 py-4 text-3xl font-extrabold text-white text-center outline-none focus:border-emerald-400/60 tabular"
                />
              </div>
            </div>
            <p className="text-white/30 text-xs mt-2 leading-relaxed">
              No need for AM/PM — we'll pick whichever is sooner.
            </p>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Halftime (mins)">
              <input
                type="number"
                inputMode="numeric"
                min="0"
                max="60"
                value={halftimeMins}
                onChange={(e) => setHalftimeMins(e.target.value)}
                className="w-full rounded-xl bg-white/10 border border-white/10 px-3 py-3 text-2xl font-extrabold text-white outline-none focus:border-emerald-400/60 tabular"
              />
            </Field>
            <Field label="End Buffer (mins)">
              <input
                type="number"
                inputMode="numeric"
                min="0"
                max="30"
                value={bufferMins}
                onChange={(e) => setBufferMins(e.target.value)}
                className="w-full rounded-xl bg-white/10 border border-white/10 px-3 py-3 text-2xl font-extrabold text-white outline-none focus:border-emerald-400/60 tabular"
              />
            </Field>
          </div>
          <p className="text-white/30 text-xs mb-2 -mt-3 leading-relaxed">
            We'll subtract halftime and the end buffer from the remaining time, then split what's left evenly into two halves.
          </p>
        </>
      ) : (
        <>
          <p className="text-white/50 text-sm mb-5 leading-relaxed">
            Enter the length of each half or period in minutes. The timer counts down from there — tap it to pause or resume.
          </p>
          <Field label="Period length (minutes)">
            <input
              type="number"
              inputMode="numeric"
              min="1"
              max="120"
              value={minutes}
              onChange={(e) => setMinutes(e.target.value)}
              className="w-full rounded-xl bg-white/10 border border-white/10 px-4 py-4 text-3xl font-extrabold text-white outline-none focus:border-emerald-400/60 tabular"
            />
          </Field>
        </>
      )}

      <BigButton
        onClick={start}
        className="w-full rounded-2xl bg-emerald-400 text-black text-lg font-extrabold py-5"
      >
        Start Countdown
      </BigButton>

      {isConfigured && (
        <BigButton
          onClick={deleteTimer}
          className="w-full rounded-2xl bg-red-500/15 border border-red-500/40 py-4 font-bold text-red-400 mt-3"
        >
          Reset / Delete Timer
        </BigButton>
      )}
    </Sheet>
  );
}

function TimerBar({ globalTimer }) {
  const { timer, remainingMs, toggle, reset } = globalTimer;
  const [setupOpen, setSetupOpen] = useState(false);

  if (!timer.configured) {
    return (
      <>
        <button
          onClick={() => setSetupOpen(true)}
          className="btn-press w-full flex items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-white/20 py-4 text-white/60 font-bold text-sm mb-4"
        >
          <Icon name="Clock" size={18} />
          Set Game Clock
        </button>
        <TimerSetupSheet
          open={setupOpen}
          onClose={() => setSetupOpen(false)}
          onSetupAuto={globalTimer.setupAuto}
          onSetupManual={globalTimer.setupManual}
          initialMode={timer.mode}
          initialHalftimeMins={timer.halftimeMins}
          initialBufferMins={timer.bufferMins}
          isConfigured={timer.configured}
          onReset={reset}
        />
      </>
    );
  }

  if (timer.finished) {
    return (
      <div className="flash-red rounded-2xl border-2 border-red-500 py-4 px-4 mb-4 flex items-center justify-between">
        <div>
          <div className="text-red-400 text-xs font-extrabold tracking-widest">TIME'S UP</div>
          <div className="text-2xl font-black tabular text-white">00:00</div>
        </div>
        <IconButton name="RotateCcw" onClick={reset} label="Reset timer" />
      </div>
    );
  }

  const seconds = remainingMs / 1000;
  const isRunning = timer.isRunning;

  return (
    <div className="mb-4">
      <button
        onClick={toggle}
        className={`btn-press w-full rounded-2xl border-2 py-4 px-5 flex items-center justify-between transition-colors ${
          isRunning ? 'border-emerald-400/40 bg-emerald-400/5' : 'border-red-500 bg-red-500/10 animate-pulse-fast'
        }`}
      >
        <div className="text-left">
          <div className={`text-xs font-extrabold tracking-widest ${isRunning ? 'text-emerald-400' : 'text-red-400'}`}>
            HALF {timer.currentHalf} {isRunning ? '· RUNNING' : '· PAUSED'}
          </div>
          <div className={`text-4xl font-black tabular ${isRunning ? 'text-white' : 'text-red-400'}`}>
            {formatClock(seconds)}
          </div>
        </div>
        <Icon name={isRunning ? 'Pause' : 'Play'} size={30} className={isRunning ? 'text-emerald-400' : 'text-red-400'} />
      </button>
      <div className="flex justify-end mt-1.5">
        <button onClick={() => setSetupOpen(true)} className="text-white/30 text-xs font-semibold flex items-center gap-1 py-1 px-2">
          <Icon name="Settings" size={12} /> {timer.endLabel}
        </button>
      </div>
      <TimerSetupSheet
        open={setupOpen}
        onClose={() => setSetupOpen(false)}
        onSetupAuto={globalTimer.setupAuto}
        onSetupManual={globalTimer.setupManual}
        initialMode={timer.mode}
        initialHalftimeMins={timer.halftimeMins}
        initialBufferMins={timer.bufferMins}
        isConfigured={timer.configured}
        onReset={reset}
      />
    </div>
  );
}

const ACTIVITY_PERIODS = ['First Activity', 'Second Activity', 'Third Activity', 'Fourth Activity'];

function EndGameSheet({ open, onClose, sportLabel, teamA, teamB, scoreA, scoreB }) {
  const [activityPeriod, setActivityPeriod] = useLocalStorage('refcourt_activity_period_v1', 'First Activity');
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!open) setCopied(false);
  }, [open]);

  const winnerName = scoreA > scoreB ? teamA : scoreB > scoreA ? teamB : null;
  const message = winnerName
    ? `${winnerName} wins ${sportLabel} ${activityPeriod}.`
    : `${sportLabel} ${activityPeriod} ended in a tie, ${scoreA}-${scoreB}.`;

  const copyMessage = async () => {
    try {
      await navigator.clipboard.writeText(message);
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = message;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {}
    }
    setCopied(true);
    vibrate(30);
    setTimeout(() => setCopied(false), 1500);
  };

  const sendWhatsApp = () => {
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
  };

  return (
    <Sheet open={open} onClose={onClose} title="End Game">
      <Field label="Activity Period">
        <div className="grid grid-cols-2 gap-2 mb-3">
          {ACTIVITY_PERIODS.map((p) => (
            <button
              key={p}
              onClick={() => setActivityPeriod(p)}
              className={`btn-press rounded-xl py-3 text-sm font-bold ${activityPeriod === p ? 'bg-white text-black' : 'bg-white/10 text-white/70'}`}
            >
              {p}
            </button>
          ))}
        </div>
        <TextInput
          value={activityPeriod}
          onChange={(e) => setActivityPeriod(e.target.value)}
          placeholder="Custom period name..."
          maxLength={30}
        />
      </Field>

      <div className="rounded-2xl bg-white/5 border border-white/10 p-5 mb-6 text-center">
        <div className="text-xs font-extrabold tracking-widest text-white/40 mb-2">FINAL SCORE</div>
        <div className="text-lg font-bold mb-3">{teamA} {scoreA} — {scoreB} {teamB}</div>
        <div className="text-emerald-400 font-extrabold text-xl leading-snug">{message}</div>
      </div>

      <BigButton
        onClick={copyMessage}
        className="w-full rounded-2xl bg-white/10 py-6 font-extrabold text-lg mb-3 flex items-center justify-center gap-2"
      >
        <Icon name={copied ? 'Check' : 'Copy'} size={22} /> {copied ? 'Copied!' : 'Copy Message'}
      </BigButton>
      <BigButton
        onClick={sendWhatsApp}
        className="w-full rounded-2xl bg-emerald-400 text-black py-6 font-extrabold text-lg flex items-center justify-center gap-2"
      >
        <Icon name="Send" size={22} /> Send to Bentzi (WhatsApp)
      </BigButton>
    </Sheet>
  );
}

function VibrationTest() {
  const [result, setResult] = useState(null);

  const test = () => {
    if (!('vibrate' in navigator)) {
      setResult('unsupported');
      return;
    }
    const ok = navigator.vibrate(300);
    setResult(ok ? 'sent' : 'blocked');
  };

  return (
    <button
      onClick={test}
      className="btn-press mt-4 mx-auto flex items-center gap-2 rounded-full bg-white/5 border border-white/10 px-4 py-2 text-[11px] font-bold text-white/40"
    >
      <Icon name="Volume2" size={13} />
      Test Vibration
      {result === 'sent' && <span className="text-emerald-400">· sent — feel it?</span>}
      {result === 'blocked' && <span className="text-red-400">· blocked by browser</span>}
      {result === 'unsupported' && <span className="text-red-400">· not supported here</span>}
    </button>
  );
}

/* ============================== VOLLEYBALL ============================== */

const VB_KEY = 'refcourt_volleyball_v1';

function defaultVolleyball() {
  return { teamA: 'Team A', teamB: 'Team B', colorA: null, colorB: null, scoreA: 0, scoreB: 0, serving: 'A', streak: 0, set: 1, target: 25, setHistory: [] };
}

function Volleyball({ globalTimer, onBack }) {
  const [vb, setVb] = useLocalStorage(VB_KEY, defaultVolleyball());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [endGameOpen, setEndGameOpen] = useState(false);

  const point = () => {
    setVb((s) => ({
      ...s,
      scoreA: s.serving === 'A' ? s.scoreA + 1 : s.scoreA,
      scoreB: s.serving === 'B' ? s.scoreB + 1 : s.scoreB,
      streak: s.streak + 1,
    }));
  };

  const sideOut = () => {
    setVb((s) => ({ ...s, serving: s.serving === 'A' ? 'B' : 'A', streak: 0 }));
    vibrate(40);
  };

  const undo = (team) => {
    setVb((s) => ({ ...s, [team === 'A' ? 'scoreA' : 'scoreB']: Math.max(0, (team === 'A' ? s.scoreA : s.scoreB) - 1) }));
  };

  const newSet = () => setVb((s) => {
    const winner = s.scoreA > s.scoreB ? 'A' : s.scoreB > s.scoreA ? 'B' : null;
    return { ...s, scoreA: 0, scoreB: 0, streak: 0, set: s.set + 1, setHistory: [...(s.setHistory || []), winner] };
  });

  const switchSides = () => setVb((s) => ({
    ...s,
    teamA: s.teamB, teamB: s.teamA,
    colorA: s.colorB, colorB: s.colorA,
    scoreA: s.scoreB, scoreB: s.scoreA,
    serving: s.serving === 'A' ? 'B' : 'A',
  }));

  const setServer = (team) => setVb((s) => ({ ...s, serving: team, streak: 0 }));

  const spTarget = vb.target || 25;
  const serverScore = vb.serving === 'A' ? vb.scoreA : vb.scoreB;
  const receiverScore = vb.serving === 'A' ? vb.scoreB : vb.scoreA;
  const serverName = vb.serving === 'A' ? vb.teamA : vb.teamB;
  const pointServeActive = serverScore >= spTarget - 1 && (serverScore - receiverScore) >= 1;
  const winByTwo = Math.min(vb.scoreA, vb.scoreB) >= spTarget - 1;
  const bannerText = pointServeActive ? `${serverName} ${winByTwo ? 'WINS BY 2' : 'POINT SERVE'}` : null;
  const setPointRef = useRef(false);
  useEffect(() => {
    if (pointServeActive && !setPointRef.current) vibrate(40);
    setPointRef.current = pointServeActive;
  }, [pointServeActive]);

  const setsWonA = (vb.setHistory || []).filter((w) => w === 'A').length;
  const setsWonB = (vb.setHistory || []).filter((w) => w === 'B').length;

  return (
    <div className="px-5 pt-6 pb-8 max-w-md mx-auto flex flex-col min-h-screen">
      <EndGamePill onClick={() => setEndGameOpen(true)} />
      <Header title="Volleyball" onBack={onBack} onSettings={() => setSettingsOpen(true)} />
      <TimerBar globalTimer={globalTimer} />

      <div className="flex items-center justify-between mb-2 px-1">
        <div className="text-white/40 text-xs font-extrabold tracking-widest">SET {vb.set}</div>
        <div className="text-white/40 text-xs font-extrabold tracking-widest">STREAK {vb.streak}</div>
      </div>

      <div className="text-center text-white/50 text-xs font-bold mb-3">
        SETS &middot; {vb.teamA} {setsWonA} &ndash; {setsWonB} {vb.teamB}
      </div>

      {bannerText && (
        <div className="mb-3 rounded-2xl bg-yellow-400 text-black text-center py-2.5 font-extrabold text-sm tracking-widest animate-pulse-fast">
          {bannerText}
        </div>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4 flex-1">
        {['A', 'B'].map((team) => {
          const serving = vb.serving === team;
          const name = team === 'A' ? vb.teamA : vb.teamB;
          const score = team === 'A' ? vb.scoreA : vb.scoreB;
          const color = team === 'A' ? vb.colorA : vb.colorB;
          const c = teamColorClasses(color);
          return (
            <button
              key={team}
              onClick={() => setServer(team)}
              className={`btn-press rounded-3xl flex flex-col items-center justify-center py-8 gap-2 transition-colors ${c.bg} ${
                serving ? 'border-4 border-emerald-400 ring-4 ring-emerald-400/40' : `border-2 ${c.border}`
              }`}
            >
              {serving && (
                <div className="flex items-center gap-1 text-emerald-400 text-xs font-extrabold tracking-widest mb-1">
                  <Icon name="CircleDot" size={12} /> SERVING
                </div>
              )}
              <div className={`text-lg font-bold ${c.text} opacity-70 truncate max-w-full px-2`}>{name}</div>
              <div className={`text-7xl font-black tabular ${c.text}`}>{score}</div>
              <div
                role="button"
                onClick={(e) => { e.stopPropagation(); undo(team); }}
                className={`btn-press mt-2 w-10 h-10 rounded-full ${c.overlay} ${c.text} flex items-center justify-center`}
              >
                <Icon name="Minus" size={16} />
              </div>
            </button>
          );
        })}
      </div>

      <div className="grid grid-cols-2 gap-3">
        <BigButton onClick={sideOut} className="rounded-3xl bg-red-500/15 border-2 border-red-500 py-7 text-red-400 font-extrabold text-xl flex flex-col items-center gap-1">
          <Icon name="ArrowLeftRight" size={26} />
          Side Out
        </BigButton>
        <BigButton onClick={point} className="rounded-3xl bg-emerald-400 py-7 text-black font-extrabold text-xl flex flex-col items-center gap-1">
          <Icon name="Plus" size={26} />
          Point
        </BigButton>
      </div>

      <Sheet open={settingsOpen} onClose={() => setSettingsOpen(false)} title="Volleyball Settings">
        <TeamPicker
          label="Team A"
          teamName={vb.teamA}
          teamColor={vb.colorA}
          onSelect={(t) => setVb((s) => ({ ...s, teamA: t.label, colorA: t.color }))}
          onCustomName={(v) => setVb((s) => ({ ...s, teamA: v }))}
          onCustomColor={(c) => setVb((s) => ({ ...s, colorA: c }))}
        />
        <TeamPicker
          label="Team B"
          teamName={vb.teamB}
          teamColor={vb.colorB}
          onSelect={(t) => setVb((s) => ({ ...s, teamB: t.label, colorB: t.color }))}
          onCustomName={(v) => setVb((s) => ({ ...s, teamB: v }))}
          onCustomColor={(c) => setVb((s) => ({ ...s, colorB: c }))}
        />
        <Field label="Points to Win Set">
          <input
            type="number"
            inputMode="numeric"
            min="1"
            max="99"
            value={vb.target ?? 25}
            onChange={(e) => {
              const v = e.target.value;
              setVb((s) => ({ ...s, target: v === '' ? '' : Math.max(1, Math.min(99, parseInt(v, 10) || 1)) }));
            }}
            className="w-full rounded-xl bg-white/10 border border-white/10 px-4 py-3 text-2xl font-extrabold text-white outline-none focus:border-emerald-400/60 tabular"
          />
          <p className="text-white/30 text-xs mt-2 leading-relaxed">
            We'll flag "Point Serve" when the serving team can win the set on this serve — and "Wins By 2" once both teams are close enough that the win-by-two rule is in play.
          </p>
        </Field>
        <BigButton onClick={switchSides} className="w-full rounded-2xl bg-white/10 py-4 font-bold text-white mb-3 flex items-center justify-center gap-2">
          <Icon name="ArrowLeftRight" size={18} /> Switch Sides
        </BigButton>
        <BigButton onClick={newSet} className="w-full rounded-2xl bg-white/10 py-4 font-bold text-white mb-3 flex items-center justify-center gap-2">
          <Icon name="RotateCcw" size={18} /> Start New Set
        </BigButton>
        <BigButton
          onClick={() => setVb(defaultVolleyball())}
          className="w-full rounded-2xl bg-red-500/15 border border-red-500/40 py-4 font-bold text-red-400 mb-3"
        >
          Reset Match
        </BigButton>
      </Sheet>

      <EndGameSheet
        open={endGameOpen}
        onClose={() => setEndGameOpen(false)}
        sportLabel="Volleyball"
        teamA={vb.teamA}
        teamB={vb.teamB}
        scoreA={vb.scoreA}
        scoreB={vb.scoreB}
      />
    </div>
  );
}

/* ============================== FOOTBALL ============================== */

const FB_KEY = 'refcourt_football_v1';

function defaultFootball() {
  return {
    teamA: 'Team A', teamB: 'Team B', scoreA: 0, scoreB: 0,
    colorA: null, colorB: null,
    timeoutMode: 'half', timeoutCount: 3,
    timeoutsA: 3, timeoutsB: 3,
    half: 1,
  };
}

function Football({ globalTimer, onBack }) {
  const [fb, setFb] = useLocalStorage(FB_KEY, defaultFootball());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [endGameOpen, setEndGameOpen] = useState(false);

  const addPoint = (team) => {
    setFb((s) => ({ ...s, [team === 'A' ? 'scoreA' : 'scoreB']: (team === 'A' ? s.scoreA : s.scoreB) + 1 }));
    vibrate(30);
  };

  const undo = (team) => {
    setFb((s) => ({ ...s, [team === 'A' ? 'scoreA' : 'scoreB']: Math.max(0, (team === 'A' ? s.scoreA : s.scoreB) - 1) }));
  };

  const useTimeout = (team) => {
    setFb((s) => {
      const key = team === 'A' ? 'timeoutsA' : 'timeoutsB';
      if (s[key] <= 0) return s;
      vibrate(50);
      return { ...s, [key]: s[key] - 1 };
    });
  };

  const restoreTimeout = (team) => {
    setFb((s) => {
      const key = team === 'A' ? 'timeoutsA' : 'timeoutsB';
      if (s[key] >= s.timeoutCount) return s;
      return { ...s, [key]: s[key] + 1 };
    });
  };

  const changeHalf = (delta) => {
    setFb((s) => {
      const half = Math.max(1, s.half + delta);
      if (delta > 0 && s.timeoutMode === 'half') {
        return { ...s, half, timeoutsA: s.timeoutCount, timeoutsB: s.timeoutCount };
      }
      return { ...s, half };
    });
  };

  const TimeoutFooter = ({ team }) => {
    const remaining = team === 'A' ? fb.timeoutsA : fb.timeoutsB;
    const color = team === 'A' ? fb.colorA : fb.colorB;
    const c = teamColorClasses(color);
    const light = c.text === 'text-black';
    const dotFill = light ? 'bg-black border-black' : 'bg-white border-white';
    const dotEmpty = light ? 'border-black/30' : 'border-white/30';
    return (
      <div className="w-full mt-1 px-1 flex justify-start">
        <div className="flex items-center gap-0.5 rounded-2xl bg-black/20 pl-2.5 pr-1 py-1">
          <span className={`text-[9px] font-bold ${c.sub} tracking-widest mr-1`}>TO</span>
          {Array.from({ length: fb.timeoutCount }).map((_, i) => (
            <button
              key={i}
              type="button"
              onClick={(e) => { e.stopPropagation(); i < remaining ? useTimeout(team) : restoreTimeout(team); }}
              className="btn-press flex items-center justify-center w-8 h-8 shrink-0"
            >
              <span className={`block w-4 h-4 rounded-full border ${i < remaining ? dotFill : `${dotEmpty} bg-transparent`}`} />
            </button>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="px-5 pt-6 pb-8 max-w-md mx-auto flex flex-col min-h-screen">
      <EndGamePill onClick={() => setEndGameOpen(true)} />
      <Header title="Football" onBack={onBack} onSettings={() => setSettingsOpen(true)} />
      <TimerBar globalTimer={globalTimer} />

      <div className="flex flex-col gap-3 flex-1 mb-4" style={{ minHeight: '48vh' }}>
        <ScoreHalf
          name={fb.teamA}
          score={fb.scoreA}
          onScore={() => addPoint('A')}
          onUndo={() => undo('A')}
          scoreClassName="text-7xl"
          footer={<TimeoutFooter team="A" />}
          color={fb.colorA}
        />
        <ScoreHalf
          name={fb.teamB}
          score={fb.scoreB}
          onScore={() => addPoint('B')}
          onUndo={() => undo('B')}
          scoreClassName="text-7xl"
          footer={<TimeoutFooter team="B" />}
          color={fb.colorB}
        />
      </div>

      <div className="rounded-2xl bg-zinc-900 border border-white/10 py-4 px-5 flex items-center justify-between">
        <IconButton name="ChevronLeft" onClick={() => changeHalf(-1)} label="Previous half" />
        <div className="text-center">
          <div className="text-xs font-extrabold tracking-widest text-white/40">HALF</div>
          <div className="text-3xl font-black tabular">
            {fb.half}
            <span className="text-white/30 text-lg">/2</span>
          </div>
        </div>
        <IconButton name="ChevronRight" onClick={() => changeHalf(1)} label="Next half" />
      </div>

      <Sheet open={settingsOpen} onClose={() => setSettingsOpen(false)} title="Football Settings">
        <TeamPicker
          label="Team A"
          teamName={fb.teamA}
          teamColor={fb.colorA}
          onSelect={(t) => setFb((s) => ({ ...s, teamA: t.label, colorA: t.color }))}
          onCustomName={(v) => setFb((s) => ({ ...s, teamA: v }))}
          onCustomColor={(c) => setFb((s) => ({ ...s, colorA: c }))}
        />
        <TeamPicker
          label="Team B"
          teamName={fb.teamB}
          teamColor={fb.colorB}
          onSelect={(t) => setFb((s) => ({ ...s, teamB: t.label, colorB: t.color }))}
          onCustomName={(v) => setFb((s) => ({ ...s, teamB: v }))}
          onCustomColor={(c) => setFb((s) => ({ ...s, colorB: c }))}
        />
        <Field label="Timeouts Reset">
          <Segmented
            options={[{ value: 'half', label: 'Per Half' }, { value: 'game', label: 'Per Game' }]}
            value={fb.timeoutMode}
            onChange={(v) => setFb((s) => ({ ...s, timeoutMode: v }))}
          />
        </Field>
        <Field label="Timeouts per team">
          <Stepper
            value={fb.timeoutCount}
            min={1}
            max={6}
            onChange={(v) => setFb((s) => ({ ...s, timeoutCount: v, timeoutsA: v, timeoutsB: v }))}
          />
        </Field>
        <BigButton
          onClick={() => setFb(defaultFootball())}
          className="w-full rounded-2xl bg-red-500/15 border border-red-500/40 py-4 font-bold text-red-400 mt-2 mb-3"
        >
          Reset Game
        </BigButton>
      </Sheet>

      <EndGameSheet
        open={endGameOpen}
        onClose={() => setEndGameOpen(false)}
        sportLabel="Football"
        teamA={fb.teamA}
        teamB={fb.teamB}
        scoreA={fb.scoreA}
        scoreB={fb.scoreB}
      />
    </div>
  );
}

/* ============================== UNIVERSAL TRACKER ============================== */

const UNIVERSAL_CONFIG = {
  soccer: { title: 'Soccer', unit: 'Half', maxUnit: 2, icon: '⚽', accent: 'emerald-400' },
  hockey: { title: 'Hockey', unit: 'Period', maxUnit: 3, icon: '🏒', accent: 'sky-400' },
  baseball: { title: 'Baseball', unit: 'Inning', maxUnit: 9, icon: '⚾', accent: 'red-400' },
};

function defaultUniversal() {
  return { teamA: 'Team A', teamB: 'Team B', scoreA: 0, scoreB: 0, colorA: null, colorB: null, period: 1, half: 'Top' };
}

function Universal({ sport, globalTimer, onBack }) {
  const cfg = UNIVERSAL_CONFIG[sport];
  const key = `refcourt_${sport}_v1`;
  const [g, setG] = useLocalStorage(key, defaultUniversal());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [endGameOpen, setEndGameOpen] = useState(false);

  const addPoint = (team) => {
    setG((s) => ({ ...s, [team === 'A' ? 'scoreA' : 'scoreB']: (team === 'A' ? s.scoreA : s.scoreB) + 1 }));
    vibrate(30);
  };
  const undo = (team) => {
    setG((s) => ({ ...s, [team === 'A' ? 'scoreA' : 'scoreB']: Math.max(0, (team === 'A' ? s.scoreA : s.scoreB) - 1) }));
  };

  const changePeriod = (delta) => {
    setG((s) => ({ ...s, period: Math.max(1, s.period + delta) }));
  };

  const toggleHalf = () => setG((s) => ({ ...s, half: s.half === 'Top' ? 'Bottom' : 'Top' }));

  return (
    <div className="px-5 pt-6 pb-8 max-w-md mx-auto flex flex-col min-h-screen">
      <EndGamePill onClick={() => setEndGameOpen(true)} />
      <Header title={cfg.title} onBack={onBack} onSettings={() => setSettingsOpen(true)} />
      {sport !== 'baseball' && <TimerBar globalTimer={globalTimer} />}

      <div className="flex flex-col gap-3 flex-1 mb-4" style={{ minHeight: '48vh' }}>
        <ScoreHalf name={g.teamA} score={g.scoreA} onScore={() => addPoint('A')} onUndo={() => undo('A')} color={g.colorA} />
        <ScoreHalf name={g.teamB} score={g.scoreB} onScore={() => addPoint('B')} onUndo={() => undo('B')} color={g.colorB} />
      </div>

      <div className="rounded-2xl bg-zinc-900 border border-white/10 py-4 px-5 flex items-center justify-between">
        <IconButton name="ChevronLeft" onClick={() => changePeriod(-1)} label="Previous period" />
        <div className="text-center">
          <div className="text-xs font-extrabold tracking-widest text-white/40">{cfg.unit.toUpperCase()}</div>
          <div className="text-3xl font-black tabular">
            {g.period}
            <span className="text-white/30 text-lg">/{cfg.maxUnit}</span>
          </div>
        </div>
        <IconButton name="ChevronRight" onClick={() => changePeriod(1)} label="Next period" />
      </div>

      {sport === 'baseball' && (
        <button
          onClick={toggleHalf}
          className="btn-press w-full mt-3 rounded-2xl bg-zinc-900 border-2 border-white/10 py-5 px-5 flex items-center justify-center gap-2 active:bg-white/10"
        >
          <Icon name="ArrowLeftRight" size={20} className="text-white/40" />
          <span className="text-lg font-extrabold tracking-wide">
            {g.half.toUpperCase()} &middot; {g.half === 'Top' ? g.teamA : g.teamB} BATTING
          </span>
        </button>
      )}

      <Sheet open={settingsOpen} onClose={() => setSettingsOpen(false)} title={`${cfg.title} Settings`}>
        <TeamPicker
          label="Team A"
          teamName={g.teamA}
          teamColor={g.colorA}
          onSelect={(t) => setG((s) => ({ ...s, teamA: t.label, colorA: t.color }))}
          onCustomName={(v) => setG((s) => ({ ...s, teamA: v }))}
          onCustomColor={(c) => setG((s) => ({ ...s, colorA: c }))}
        />
        <TeamPicker
          label="Team B"
          teamName={g.teamB}
          teamColor={g.colorB}
          onSelect={(t) => setG((s) => ({ ...s, teamB: t.label, colorB: t.color }))}
          onCustomName={(v) => setG((s) => ({ ...s, teamB: v }))}
          onCustomColor={(c) => setG((s) => ({ ...s, colorB: c }))}
        />
        <BigButton
          onClick={() => setG(defaultUniversal())}
          className="w-full rounded-2xl bg-red-500/15 border border-red-500/40 py-4 font-bold text-red-400 mt-2 mb-3"
        >
          Reset Game
        </BigButton>
      </Sheet>

      <EndGameSheet
        open={endGameOpen}
        onClose={() => setEndGameOpen(false)}
        sportLabel={cfg.title}
        teamA={g.teamA}
        teamB={g.teamB}
        scoreA={g.scoreA}
        scoreB={g.scoreB}
      />
    </div>
  );
}

/* ============================== BASKETBALL ============================== */

const BK_KEY = 'refcourt_basketball_v1';

function defaultBasketball() {
  return { teamA: 'Team A', teamB: 'Team B', scoreA: 0, scoreB: 0, colorA: null, colorB: null, half: 1, periodMode: 'halves', history: [] };
}

function Basketball({ globalTimer, onBack }) {
  const [bk, setBk] = useLocalStorage(BK_KEY, defaultBasketball());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [endGameOpen, setEndGameOpen] = useState(false);

  const addScore = (team, pts) => {
    setBk((s) => ({
      ...s,
      [team === 'A' ? 'scoreA' : 'scoreB']: (team === 'A' ? s.scoreA : s.scoreB) + pts,
      history: [...s.history, { team, pts }].slice(-30),
    }));
    vibrate(30);
  };

  const undoLast = () => {
    setBk((s) => {
      if (s.history.length === 0) return s;
      const last = s.history[s.history.length - 1];
      return {
        ...s,
        [last.team === 'A' ? 'scoreA' : 'scoreB']: Math.max(0, (last.team === 'A' ? s.scoreA : s.scoreB) - last.pts),
        history: s.history.slice(0, -1),
      };
    });
  };

  const setHalf = (half) => setBk((s) => ({ ...s, half }));

  const lastAction = bk.history[bk.history.length - 1];

  const TeamSide = ({ team }) => {
    const name = team === 'A' ? bk.teamA : bk.teamB;
    const score = team === 'A' ? bk.scoreA : bk.scoreB;
    const color = team === 'A' ? bk.colorA : bk.colorB;
    const c = teamColorClasses(color);
    return (
      <div className={`flex-1 rounded-3xl ${c.bg} border-2 ${c.border} flex flex-col items-center justify-center gap-3 py-4 px-3`}>
        <div className={`text-lg font-bold ${c.text} opacity-70 truncate max-w-full`}>{name}</div>
        <div className={`text-7xl font-black tabular ${c.text}`}>{score}</div>
        <div className="grid grid-cols-3 gap-2 w-full">
          <BigButton onClick={() => addScore(team, 1)} className={`rounded-2xl ${c.overlay} ${c.text} py-5 font-extrabold text-lg flex flex-col items-center gap-0.5`}>
            <span>+1</span>
            <span className={`text-[9px] font-bold ${c.sub} tracking-widest`}>FT</span>
          </BigButton>
          <BigButton onClick={() => addScore(team, 2)} className={`rounded-2xl ${c.overlay} ${c.text} py-5 font-extrabold text-lg`}>
            +2
          </BigButton>
          <BigButton onClick={() => addScore(team, 3)} className={`rounded-2xl ${c.overlay} ${c.text} border-2 border-white/30 py-5 font-extrabold text-lg`}>
            +3
          </BigButton>
        </div>
      </div>
    );
  };

  const periodOptions = bk.periodMode === 'quarters'
    ? [{ value: 1, label: '1st' }, { value: 2, label: '2nd' }, { value: 3, label: '3rd' }, { value: 4, label: '4th' }]
    : [{ value: 1, label: '1st Half' }, { value: 2, label: '2nd Half' }];

  return (
    <div className="px-5 pt-6 pb-8 max-w-md mx-auto flex flex-col min-h-screen">
      <EndGamePill onClick={() => setEndGameOpen(true)} />
      <Header title="Basketball" onBack={onBack} onSettings={() => setSettingsOpen(true)} />
      <TimerBar globalTimer={globalTimer} />

      <div className="flex flex-col gap-3 flex-1 mb-4">
        <TeamSide team="A" />
        <TeamSide team="B" />
      </div>

      <div className="rounded-2xl bg-zinc-900 border border-white/10 py-4 px-5 mb-3">
        <div className="text-xs font-extrabold tracking-widest text-white/40 text-center mb-2">
          {bk.periodMode === 'quarters' ? 'QUARTER' : 'HALF'}
        </div>
        <Segmented options={periodOptions} value={bk.half} onChange={setHalf} />
      </div>

      <BigButton
        onClick={undoLast}
        disabled={!lastAction}
        className="w-full rounded-2xl bg-white/10 py-4 font-bold text-white/80 flex items-center justify-center gap-2"
      >
        <Icon name="RotateCcw" size={18} />
        {lastAction ? `Undo +${lastAction.pts} · ${lastAction.team === 'A' ? bk.teamA : bk.teamB}` : 'Undo Last Score'}
      </BigButton>

      <Sheet open={settingsOpen} onClose={() => setSettingsOpen(false)} title="Basketball Settings">
        <TeamPicker
          label="Team A"
          teamName={bk.teamA}
          teamColor={bk.colorA}
          onSelect={(t) => setBk((s) => ({ ...s, teamA: t.label, colorA: t.color }))}
          onCustomName={(v) => setBk((s) => ({ ...s, teamA: v }))}
          onCustomColor={(c) => setBk((s) => ({ ...s, colorA: c }))}
        />
        <TeamPicker
          label="Team B"
          teamName={bk.teamB}
          teamColor={bk.colorB}
          onSelect={(t) => setBk((s) => ({ ...s, teamB: t.label, colorB: t.color }))}
          onCustomName={(v) => setBk((s) => ({ ...s, teamB: v }))}
          onCustomColor={(c) => setBk((s) => ({ ...s, colorB: c }))}
        />
        <Field label="Periods">
          <Segmented
            options={[{ value: 'halves', label: 'Halves' }, { value: 'quarters', label: 'Quarters' }]}
            value={bk.periodMode}
            onChange={(v) => setBk((s) => ({ ...s, periodMode: v, half: 1 }))}
          />
        </Field>
        <BigButton
          onClick={() => setBk(defaultBasketball())}
          className="w-full rounded-2xl bg-red-500/15 border border-red-500/40 py-4 font-bold text-red-400 mt-2 mb-3"
        >
          Reset Game
        </BigButton>
      </Sheet>

      <EndGameSheet
        open={endGameOpen}
        onClose={() => setEndGameOpen(false)}
        sportLabel="Basketball"
        teamA={bk.teamA}
        teamB={bk.teamB}
        scoreA={bk.scoreA}
        scoreB={bk.scoreB}
      />
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const [screen, setScreen] = useLocalStorage('refcourt_screen_v1', 'home');
  const globalTimer = useGlobalTimer();

  useEffect(() => {
    window.history.replaceState({ screen: 'home' }, '');
    if (screen !== 'home') {
      window.history.pushState({ screen }, '');
    }
  }, []);

  useEffect(() => {
    const onPopState = (e) => {
      setScreen((e.state && e.state.screen) || 'home');
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, [setScreen]);

  const goTo = (s) => {
    setScreen(s);
    window.history.pushState({ screen: s }, '');
  };

  const goHome = () => window.history.back();

  let content;
  if (screen === 'home') content = <Home onSelect={goTo} />;
  else if (screen === 'volleyball') content = <Volleyball globalTimer={globalTimer} onBack={goHome} />;
  else if (screen === 'football') content = <Football globalTimer={globalTimer} onBack={goHome} />;
  else if (screen === 'basketball') content = <Basketball globalTimer={globalTimer} onBack={goHome} />;
  else if (UNIVERSAL_CONFIG[screen]) content = <Universal sport={screen} globalTimer={globalTimer} onBack={goHome} />;
  else content = <Home onSelect={goTo} />;

  return <div className="min-h-screen">{content}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
