<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
    // A new service worker takes control (via skipWaiting + clients.claim)
    // whenever a deployed update is detected. Without this, a PWA left open
    // in standalone mode keeps running the stale JS/HTML it already loaded
    // until the user force-quits and reopens it. Reload once so an update
    // check on app launch actually reaches the screen. Game state survives
    // via localStorage, so this is safe mid-use.
    let reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloadedForUpdate) return;
      reloadedForUpdate = true;
      window.location.reload();
    });
  }
</script>
